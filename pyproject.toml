[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simops-studio"
version = "0.1.0"
description = "A practical EDA simulation automation, dispatch, and reporting workbench."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SimOps Studio contributors" }]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
]

[project.scripts]
simops = "simops_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

